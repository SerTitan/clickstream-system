services:
  # =============================================================================
  # KAFKA CLUSTER (3 брокера, KRaft, без ZooKeeper)
  # =============================================================================
  kafka-1:
    image: apache/kafka:3.7.1
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:29092"
    environment:
      # --- KRaft: один и тот же cluster id на всех брокерах ---
      KAFKA_CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"

      # --- Слушатели ---
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # --- Репликация системных топиков (для 3 брокеров ставим 2) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"

    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - clickstream-net

  kafka-2:
    image: apache/kafka:3.7.1
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:29092"
    environment:
      KAFKA_CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9093"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - clickstream-net

  kafka-3:
    image: apache/kafka:3.7.1
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9094:29092"
    environment:
      KAFKA_CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9094"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - clickstream-net

  # =============================================================================
  # KAFKA UI
  # =============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: clickstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - clickstream-net

  # =============================================================================
  # CLICKHOUSE
  # =============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - ch_data:/var/lib/clickhouse
    networks:
      - clickstream-net

  # =============================================================================
  # POSTGRES
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meta
      POSTGRES_USER: meta
      POSTGRES_PASSWORD: meta
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - clickstream-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meta -d meta"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =============================================================================
  # AIRFLOW
  # =============================================================================
  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://meta:meta@postgres:5432/meta
      AIRFLOW__CORE__FERNET_KEY: "CHANGE_ME_FERNET_KEY"
      AIRFLOW__WEBSERVER__SECRET_KEY: "CHANGE_ME_SECRET_KEY"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"
      _AIRFLOW_WWW_USER_FIRSTNAME: "Admin"
      _AIRFLOW_WWW_USER_LASTNAME: "User"
      _AIRFLOW_WWW_USER_ROLE: "Admin"
      _AIRFLOW_WWW_USER_EMAIL: "admin@example.com"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname "$${_AIRFLOW_WWW_USER_FIRSTNAME}" \
          --lastname "$${_AIRFLOW_WWW_USER_LASTNAME}" \
          --role "$${_AIRFLOW_WWW_USER_ROLE}" \
          --email "$${_AIRFLOW_WWW_USER_EMAIL}" || true
        echo "Airflow initialized"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - clickstream-net

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://meta:meta@postgres:5432/meta
      AIRFLOW__CORE__FERNET_KEY: "CHANGE_ME_FERNET_KEY"
      AIRFLOW__WEBSERVER__SECRET_KEY: "CHANGE_ME_SECRET_KEY"
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: webserver
    networks:
      - clickstream-net

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://meta:meta@postgres:5432/meta
      AIRFLOW__CORE__FERNET_KEY: "CHANGE_ME_FERNET_KEY"
      AIRFLOW__WEBSERVER__SECRET_KEY: "CHANGE_ME_SECRET_KEY"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - clickstream-net

  # =============================================================================
  # MONITORING — Prometheus + Grafana
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - clickstream-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - clickstream-net

    # =============================================================================
  # SUPERSET
  # =============================================================================
  superset-init:
    image: apache/superset:4.0.2
    container_name: superset-init
    environment:
      SUPERSET_SECRET_KEY: "CHANGE_ME_SUPERSET_SECRET"
      SUPERSET_HOME: /app/superset_home
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username admin \
          --firstname Admin \
          --lastname User \
          --email admin@example.com \
          --password admin || true
        superset init
        echo "Superset initialized"
    networks:
      - clickstream-net
    restart: "no"

  superset:
    image: apache/superset:4.0.2
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "CHANGE_ME_SUPERSET_SECRET"
      SUPERSET_HOME: /app/superset_home
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
    networks:
      - clickstream-net

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  ch_data:
  pg_data:
  airflow_dags:
  airflow_logs:
  prom_data:
  grafana_data:
  superset_home:

networks:
  clickstream-net:
    driver: bridge
